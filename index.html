:root[data-theme=&quot;light&quot;] {
  color-scheme: light;

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)

  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-muted {

}

.tabular-nums {

}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  min-width: min(100%, 260px);

  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;

.btn,
.form-check-input,
.form-control,
.form-range,

}

  min-height: 28px;
  align-items: center;

.btn:not(:disabled):hover {

  opacity: 0.4;

[data-lucide] {

  corner-shape: superellipse(1.5);

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {

}

          &lt;div class=&quot;panel&quot; data-help=&quot;시험 식별, 책임자, 대상 장비와 저장 기준을 등록합니다. 시험 수행일시는 새 시험 시작 시 자동 기록되므로 입력란에서 제외합니다.&quot;&gt;

              &lt;div class=&quot;field&quot; data-order=&quot;1&quot; data-help=&quot;시험을 구분하는 고유번호입니다. 호선·날짜·회차 조합으로 자동 생성한 뒤 필요 시 수정합니다.&quot;&gt;&lt;label&gt;Test ID&lt;/label&gt;&lt;input value=&quot;H2678-20260825-02&quot;&gt;&lt;/div&gt;

              &lt;div class=&quot;field&quot; data-order=&quot;3&quot; data-help=&quot;측정 수행자 또는 책임자를 입력하며 보정·수정 이력과 연결됩니다.&quot;&gt;&lt;label&gt;작업자&lt;/label&gt;&lt;input value=&quot;홍길동&quot;&gt;&lt;/div&gt;
              &lt;div class=&quot;field&quot; data-order=&quot;4&quot; data-help=&quot;선종을 선택하면 표준 베어링 수량·명칭·순서가 FWD에서 AFT 방향으로 자동 배치됩니다. 예외 구성은 아래 베어링 영역에서 수량·명칭·위치를 직접 수정할 수 있습니다.&quot;&gt;&lt;label for=&quot;ship-type&quot;&gt;선종 / 베어링 구성&lt;/label&gt;&lt;select id=&quot;ship-type&quot;&gt;&lt;option value=&quot;lngc&quot; selected&gt;LNGC · 6개&lt;/option&gt;&lt;option value=&quot;cont&quot;&gt;CONT · 6개&lt;/option&gt;&lt;option value=&quot;lpgc&quot;&gt;LPGC · 5개&lt;/option&gt;&lt;option value=&quot;vlcc&quot;&gt;VLCC · 5개&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
              &lt;div class=&quot;field&quot; data-order=&quot;5&quot; data-help=&quot;장치 연결 화면에서 저장한 압력·변위 모듈 세트와 고정 통신 주기가 자동 표시됩니다. 시험 설정에서는 임의로 변경할 수 없습니다.&quot;&gt;&lt;label for=&quot;setup-device-set-id&quot;&gt;장비 세트 ID&lt;/label&gt;&lt;input id=&quot;setup-device-set-id&quot; value=&quot;SET-014 / PRS-A-014 + DIS-B-014&quot; readonly aria-readonly=&quot;true&quot;&gt;&lt;/div&gt;
              &lt;div class=&quot;field&quot; data-order=&quot;6&quot; data-help=&quot;현재 시험의 측정 회차를 1차부터 5차까지 선택합니다.&quot;&gt;&lt;label&gt;측정 회차&lt;/label&gt;&lt;select&gt;&lt;option&gt;1차&lt;/option&gt;&lt;option selected&gt;2차&lt;/option&gt;&lt;option&gt;3차&lt;/option&gt;&lt;option&gt;4차&lt;/option&gt;&lt;option&gt;5차&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
              &lt;div class=&quot;field storage-field&quot; data-order=&quot;7&quot; data-help=&quot;태블릿 내부 저장공간에서 프로젝트 폴더를 직접 찾아 선택합니다. 선택한 위치에 원시값·최종값·리포트가 저장됩니다.&quot;&gt;&lt;label for=&quot;storage-location&quot;&gt;저장 위치&lt;/label&gt;&lt;div class=&quot;input-action&quot;&gt;&lt;input id=&quot;storage-location&quot; value=&quot;/storage/emulated/0/Jackup/H2678/Run02&quot; readonly aria-readonly=&quot;true&quot;&gt;&lt;button class=&quot;action&quot; id=&quot;browse-storage-folder&quot; type=&quot;button&quot; data-jw-tooltip=&quot;태블릿 내부 저장공간의 폴더 목록을 열어 저장 위치 선택&quot;&gt;폴더 선택&lt;/button&gt;&lt;/div&gt;&lt;span class=&quot;field-note&quot;&gt;태블릿 내부 저장공간&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;folder-picker&quot; id=&quot;folder-picker&quot; data-help=&quot;Android 태블릿의 폴더 선택 화면을 단순화한 예시입니다. 저장할 프로젝트 폴더를 선택한 뒤 ‘이 폴더 사용’을 누릅니다.&quot;&gt;

                  &lt;button class=&quot;folder-choice&quot; type=&quot;button&quot; data-folder-path=&quot;/storage/emulated/0/Documents&quot; aria-pressed=&quot;false&quot;&gt;&lt;i data-lucide=&quot;folder&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Documents&lt;br&gt;&lt;span class=&quot;sub&quot;&gt;문서&lt;/span&gt;&lt;/button&gt;
                  &lt;button class=&quot;folder-choice&quot; type=&quot;button&quot; data-folder-path=&quot;/storage/emulated/0/Jackup/H2678/Run01&quot; aria-pressed=&quot;false&quot;&gt;&lt;i data-lucide=&quot;folder&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Run01&lt;br&gt;&lt;span class=&quot;sub&quot;&gt;이전 시험&lt;/span&gt;&lt;/button&gt;
                  &lt;button class=&quot;folder-choice&quot; type=&quot;button&quot; data-folder-path=&quot;/storage/emulated/0/Jackup/H2678/Run02&quot; aria-pressed=&quot;true&quot;&gt;&lt;i data-lucide=&quot;folder&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Run02&lt;br&gt;&lt;span class=&quot;sub&quot;&gt;현재 시험&lt;/span&gt;&lt;/button&gt;

          &lt;div class=&quot;grid setup-stack&quot; style=&quot;margin-top:12px&quot;&gt;
            &lt;div class=&quot;panel setup-conditions-panel&quot; data-help=&quot;잭 유효면적은 압력(bar)을 하중(kN)으로 환산하는 핵심 상수입니다. 허용오차는 목표 반력 대비 OK/NG 판정 범위입니다.&quot;&gt;
              &lt;h3&gt;유압 잭 / 판정 조건&lt;/h3&gt;
              &lt;div class=&quot;formgrid&quot;&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;10&quot; data-help=&quot;현장에 설치한 RAM 종류를 선택하면 규정된 RAM AREA가 자동 입력됩니다. 예외 장비는 오른쪽 RAM AREA 값을 직접 수정합니다.&quot;&gt;&lt;label for=&quot;ram-type&quot;&gt;잭 종류&lt;/label&gt;&lt;select id=&quot;ram-type&quot;&gt;&lt;option value=&quot;50&quot; selected&gt;50톤 RAM&lt;/option&gt;&lt;option value=&quot;150&quot;&gt;150톤 RAM&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;11&quot; data-help=&quot;50톤 RAM은 70.85 cm², 150톤 RAM은 153.90 cm²가 자동 반영됩니다. 예외적인 경우 숫자를 직접 수정할 수 있으며 압력을 하중으로 환산하는 데 사용됩니다.&quot;&gt;&lt;label for=&quot;effective-area&quot;&gt;RAM AREA&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;effective-area&quot; type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;70.85&quot;&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 제곱센티미터&quot;&gt;cm²&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;12&quot; data-help=&quot;압력계가 전송하는 표시 단위를 선택합니다. 기본값은 bar입니다.&quot;&gt;&lt;label&gt;압력 단위&lt;/label&gt;&lt;select&gt;&lt;option&gt;bar&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;13&quot; data-help=&quot;반력 산정 시 Lift-off를 평가할 기준 변위 숫자만 입력합니다. 단위 mm는 고정값입니다.&quot;&gt;&lt;label for=&quot;reference-displacement&quot;&gt;기준 변위&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;reference-displacement&quot; type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;0.60&quot;&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 밀리미터&quot;&gt;mm&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;14&quot; data-help=&quot;목표 반력 대비 측정 반력의 허용오차를 목록에서 선택합니다. ± 기호와 % 단위는 고정값입니다.&quot;&gt;&lt;label for=&quot;reaction-tolerance&quot;&gt;허용오차&lt;/label&gt;&lt;div class=&quot;input-affix&quot;&gt;&lt;span class=&quot;unit-prefix&quot; aria-label=&quot;플러스 마이너스&quot;&gt;±&lt;/span&gt;&lt;select id=&quot;reaction-tolerance&quot;&gt;&lt;option value=&quot;1&quot;&gt;1&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;2&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;3&lt;/option&gt;&lt;option value=&quot;5&quot; selected&gt;5&lt;/option&gt;&lt;option value=&quot;10&quot;&gt;10&lt;/option&gt;&lt;/select&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 퍼센트&quot;&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;15&quot; data-help=&quot;측정 오차율과 허용오차를 어떤 조건으로 비교하여 OK로 판정할지 선택합니다. 허용오차 변경 시 비교값도 자동 갱신됩니다.&quot;&gt;&lt;label for=&quot;acceptance-criteria&quot;&gt;판정 기준&lt;/label&gt;&lt;select id=&quot;acceptance-criteria&quot;&gt;&lt;option value=&quot;gte&quot;&gt;|오차율| ≥ 5% · 같거나 클 경우 OK&lt;/option&gt;&lt;option value=&quot;lte&quot; selected&gt;|오차율| ≤ 5% · 같거나 작을 경우 OK&lt;/option&gt;&lt;option value=&quot;gt&quot;&gt;|오차율| &amp;gt; 5% · 클 경우 OK&lt;/option&gt;&lt;option value=&quot;lt&quot;&gt;|오차율| &amp;lt; 5% · 작을 경우 OK&lt;/option&gt;&lt;option value=&quot;eq&quot;&gt;|오차율| = 5% · 같을 경우 OK&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;panel setup-bearing-panel&quot; data-help=&quot;축계 도형에서 베어링을 선택하고 선택된 위치의 목표 반력과 상태만 확인합니다. 명칭은 해당 베어링 도형을 더블클릭해 수정합니다.&quot;&gt;
              &lt;h3&gt;베어링 구성&lt;/h3&gt;
              &lt;div class=&quot;shaft-layout&quot; data-help=&quot;축계를 기관측에서 선미측 방향으로 단순화한 개략 배치입니다. 베어링을 선택한 뒤 앞·뒤 이동 버튼으로 표시 순서를 조정합니다. 실제 위치 확정은 승인 도면을 기준으로 합니다.&quot;&gt;
                &lt;div class=&quot;shaft-direction&quot;&gt;&lt;span&gt;FWD · 기관측&lt;/span&gt;&lt;span&gt;AFT · 선미측&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;shaft-track&quot; id=&quot;shaft-track&quot;&gt;&lt;span class=&quot;shaft-end&quot;&gt;FWD&lt;/span&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;M/E(FWD)&lt;/button&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;M/E(AFT)&lt;/button&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;FLY WHEEL&lt;/button&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;I/S(FWD)&lt;/button&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;I/S(AFT)&lt;/button&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;FWD S/TUBE&lt;/button&gt;&lt;span class=&quot;shaft-end&quot;&gt;AFT&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;layout-controls bearing-toolbar&quot;&gt;&lt;div class=&quot;field bearing-count-field&quot; data-order=&quot;8&quot; data-help=&quot;선종 선택 시 표준 베어링 수가 자동 입력됩니다. 예외 구성에서는 수량을 직접 변경할 수 있습니다.&quot;&gt;&lt;label for=&quot;bearing-count&quot;&gt;베어링 수&lt;/label&gt;&lt;input id=&quot;bearing-count&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;6&quot;&gt;&lt;/div&gt;&lt;button class=&quot;action&quot; id=&quot;move-bearing-forward&quot; type=&quot;button&quot;&gt;← 기관측 이동&lt;/button&gt;&lt;button class=&quot;action&quot; id=&quot;move-bearing-aft&quot; type=&quot;button&quot;&gt;선미측 이동 →&lt;/button&gt;&lt;button class=&quot;action&quot; id=&quot;remove-bearing&quot; type=&quot;button&quot;&gt;삭제&lt;/button&gt;&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;selected-bearing-editor&quot; data-order=&quot;9&quot; data-help=&quot;선택된 베어링 한 개의 정보만 표시합니다. 목표 반력은 승인 설계·축계 정렬 자료에서 확인해 입력하며 상태는 대기 또는 측정으로 색상 표시됩니다.&quot;&gt;
                &lt;div class=&quot;selected-bearing-name&quot;&gt;&lt;span class=&quot;label&quot;&gt;선택 베어링&lt;/span&gt;&lt;strong id=&quot;selected-setup-bearing-name&quot;&gt;M/E(FWD)&lt;/strong&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;selected-bearing-reaction&quot;&gt;목표 반력&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;selected-bearing-reaction&quot; type=&quot;number&quot; placeholder=&quot;설계값 입력&quot;&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 킬로뉴턴&quot;&gt;kN&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;bearing-status-box&quot;&gt;&lt;span class=&quot;label&quot;&gt;상태&lt;/span&gt;&lt;div class=&quot;bearing-status-chip waiting&quot; id=&quot;selected-bearing-status&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;대기&lt;/div&gt;&lt;/div&gt;
              &lt;/div&gt;

          &lt;div class=&quot;headline&quot;&gt;&lt;div&gt;&lt;h2&gt;측정 베어링 선택&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;시험 설정에서 구성한 위치 중 이번에 Jack-up 측정할 베어링 선택&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;action primary&quot; id=&quot;start-bearing-button&quot; type=&quot;button&quot; data-jw-tooltip=&quot;선택한 베어링의 영점 상태를 확인하고 Jack-up 측정 화면으로 이동&quot;&gt;선택 위치 측정 시작&lt;/button&gt;&lt;/div&gt;
          &lt;div class=&quot;panel&quot; data-help=&quot;기관측에서 선미측 방향으로 배치된 베어링의 진행 상태를 확인합니다. 완료 위치도 재측정 회차로 다시 선택할 수 있습니다.&quot;&gt;
            &lt;div class=&quot;shaft-layout&quot;&gt;
              &lt;div class=&quot;shaft-direction&quot;&gt;&lt;span&gt;FWD · 기관측&lt;/span&gt;&lt;span&gt;AFT · 선미측&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;shaft-track&quot; id=&quot;measurement-shaft-track&quot;&gt;&lt;span class=&quot;shaft-end&quot;&gt;FWD&lt;/span&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;M/E(FWD)&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;true&quot;&gt;M/E(FWD)&lt;br&gt;측정 대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;M/E(AFT)&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;M/E(AFT)&lt;br&gt;대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;FLY WHEEL&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;FLY WHEEL&lt;br&gt;대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;I/S(FWD)&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;I/S(FWD)&lt;br&gt;대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;I/S(AFT)&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;I/S(AFT)&lt;br&gt;대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;FWD S/TUBE&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;FWD S/TUBE&lt;br&gt;대기&lt;/button&gt;&lt;span class=&quot;shaft-end&quot;&gt;AFT&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;grid two&quot; style=&quot;margin-top:12px&quot;&gt;
            &lt;div class=&quot;panel&quot; data-help=&quot;선택 위치의 목표 반력, 허용오차와 이전 회차 결과를 측정 전에 확인합니다.&quot;&gt;&lt;h3&gt;선택 위치&lt;/h3&gt;&lt;div class=&quot;metric&quot; id=&quot;selected-measurement-bearing&quot;&gt;M/E(FWD)&lt;/div&gt;&lt;table&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;목표 반력&lt;/td&gt;&lt;td id=&quot;selected-bearing-target&quot;&gt;미입력&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;허용오차&lt;/td&gt;&lt;td&gt;±5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;측정 회차&lt;/td&gt;&lt;td&gt;2차&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;이전 결과&lt;/td&gt;&lt;td id=&quot;selected-bearing-previous&quot;&gt;미측정&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
            &lt;div class=&quot;panel&quot; data-help=&quot;Jack-up 측정 시작 전 두 센서의 연결과 영점 상태를 확인합니다. 유압장치는 앱에서 제어하지 않습니다.&quot;&gt;&lt;h3&gt;측정 전 확인&lt;/h3&gt;&lt;table&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;압력 모듈&lt;/td&gt;&lt;td class=&quot;good&quot;&gt;연결 · Zero OK&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;다이얼 게이지&lt;/td&gt;&lt;td class=&quot;good&quot;&gt;연결 · Zero OK&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;데이터 스트리밍&lt;/td&gt;&lt;td class=&quot;good&quot;&gt;1초 주기 정상&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;banner&quot;&gt;선택 위치와 실제 JIG·유압 잭 설치 위치가 일치하는지 작업자가 최종 확인합니다.&lt;/div&gt;&lt;/div&gt;
