.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;jackup-wireframe&quot;&gt;
  &lt;style&gt;
    #jackup-wireframe {

        &lt;section class=&quot;screen&quot; data-panel=&quot;setup&quot;&gt;
          &lt;div class=&quot;headline&quot;&gt;&lt;div&gt;&lt;h2&gt;장치 설정&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;선종·베어링 구성 → 장치 연결·게이지 지정&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;action primary&quot; id=&quot;setup-complete-button&quot; type=&quot;button&quot; data-jw-tooltip=&quot;베어링 구성을 확인하고 장치 연결·게이지 지정으로 이동&quot;&gt;장치 연결 설정 →&lt;/button&gt;&lt;/div&gt;
          &lt;div class=&quot;setup-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;장치 설정 단계&quot;&gt;
            &lt;button class=&quot;action primary&quot; type=&quot;button&quot; id=&quot;setup-conditions-tab&quot; role=&quot;tab&quot; data-setup-tab=&quot;conditions&quot; aria-controls=&quot;setup-conditions-content&quot; aria-selected=&quot;true&quot;&gt;1 · 기본 정보·베어링 구성&lt;/button&gt;

          &lt;div class=&quot;panel&quot; data-help=&quot;시험 식별, 책임자, 대상 장비와 저장 기준을 등록합니다. 시험 수행일시는 새 시험 시작 시 자동 기록되므로 입력란에서 제외합니다.&quot;&gt;

                &lt;div class=&quot;layout-controls bearing-toolbar&quot;&gt;&lt;div class=&quot;field bearing-count-field&quot; data-order=&quot;7&quot; data-help=&quot;선종 선택 시 표준 베어링 수가 자동 입력됩니다. 예외 구성에서는 수량을 직접 변경할 수 있습니다.&quot;&gt;&lt;label for=&quot;bearing-count&quot;&gt;베어링 수&lt;/label&gt;&lt;input id=&quot;bearing-count&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;6&quot;&gt;&lt;/div&gt;&lt;button class=&quot;action&quot; id=&quot;move-bearing-forward&quot; type=&quot;button&quot;&gt;기관측 이동 →&lt;/button&gt;&lt;button class=&quot;action&quot; id=&quot;move-bearing-aft&quot; type=&quot;button&quot;&gt;← 선미측 이동&lt;/button&gt;&lt;button class=&quot;action&quot; id=&quot;remove-bearing&quot; type=&quot;button&quot;&gt;삭제&lt;/button&gt;&lt;/div&gt;

              &lt;div class=&quot;shaft-track&quot; id=&quot;measurement-shaft-track&quot;&gt;&lt;span class=&quot;shaft-end&quot;&gt;AFT&lt;/span&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;FWD S/TUBE&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;FWD S/TUBE&lt;br&gt;대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;I/S(AFT)&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;I/S(AFT)&lt;br&gt;대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;I/S(FWD)&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;I/S(FWD)&lt;br&gt;대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;FLY WHEEL&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;FLY WHEEL&lt;br&gt;대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;M/E(AFT)&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;M/E(AFT)&lt;br&gt;대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;M/E(FWD)&quot; data-target=&quot;미입력&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;true&quot;&gt;M/E(FWD)&lt;br&gt;측정 대기&lt;/button&gt;&lt;span class=&quot;shaft-end&quot;&gt;FWD&lt;/span&gt;&lt;/div&gt;

            &lt;div class=&quot;panel bearing-conditions-panel&quot; style=&quot;margin-top:12px&quot; data-help=&quot;잭 유효면적은 압력을 하중(kN)으로 환산하는 핵심 상수입니다. 선택한 압력 단위에 맞춰 환산하며 동일한 압력이라면 계산 하중은 같습니다. M/E로 시작하는 메인엔진 베어링은 최소·최대 반력(톤 tf), 나머지는 기존 허용오차(%) 및 판정 기준으로 설정합니다. 목표 반력과 허용범위는 베어링별로 각각 저장합니다. 베어링 구성 도형에서 다른 위치를 선택하면 해당 위치의 조건을 불러옵니다. 잭 종류·면적·압력 단위는 공통 설정입니다.&quot;&gt;
              &lt;h3&gt;유압 잭 / 판정 조건&lt;/h3&gt;
              &lt;div class=&quot;conditions-bearing-banner&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;&lt;span class=&quot;selection-caption&quot;&gt;선택된 베어링&lt;/span&gt;&lt;strong id=&quot;conditions-bearing-name&quot;&gt;M/E(FWD)&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;formgrid&quot;&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;9&quot; data-help=&quot;현장에 설치한 RAM 종류를 선택하면 규정된 RAM AREA가 자동 입력됩니다. 직접 입력을 선택하면 같은 박스에서 잭 종류 또는 정격을 입력할 수 있습니다.&quot;&gt;&lt;label for=&quot;ram-type&quot;&gt;잭 종류&lt;/label&gt;&lt;div class=&quot;editable-select-control&quot;&gt;&lt;select id=&quot;ram-type&quot;&gt;&lt;option value=&quot;50&quot; selected&gt;50톤 RAM&lt;/option&gt;&lt;option value=&quot;150&quot;&gt;150톤 RAM&lt;/option&gt;&lt;option value=&quot;custom&quot;&gt;직접 입력&lt;/option&gt;&lt;/select&gt;&lt;input id=&quot;custom-ram-type&quot; aria-label=&quot;잭 종류 직접 입력&quot; placeholder=&quot;잭 종류를 입력하세요&quot; hidden&gt;&lt;button class=&quot;custom-select-return&quot; id=&quot;ram-type-return&quot; type=&quot;button&quot; aria-label=&quot;잭 종류 목록 다시 열기&quot; data-jw-tooltip=&quot;잭 종류 목록 다시 열기&quot; hidden&gt;&lt;i data-lucide=&quot;chevron-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;10&quot; data-help=&quot;50톤 RAM은 70.85 cm², 150톤 RAM은 153.90 cm²가 자동 반영됩니다. 예외적인 경우 숫자를 직접 수정할 수 있으며 압력을 하중으로 환산하는 데 사용됩니다.&quot;&gt;&lt;label for=&quot;effective-area&quot;&gt;RAM AREA&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;effective-area&quot; type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;70.85&quot;&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 제곱센티미터&quot;&gt;cm²&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;11&quot; data-help=&quot;전체 화면의 압력 표시·입력 단위를 선택합니다. kg/㎠는 kgf/cm²를 의미하며 1 kg/㎠ = 0.980665 bar입니다. 수신 원본의 단위와는 별개이며, 같은 압력의 단위만 바꾸므로 하중·최종 반력·판정은 바뀌지 않습니다.&quot;&gt;&lt;label for=&quot;pressure-unit&quot;&gt;압력 단위&lt;/label&gt;&lt;select id=&quot;pressure-unit&quot;&gt;&lt;option value=&quot;bar&quot; selected&gt;bar&lt;/option&gt;&lt;option value=&quot;kg/cm2&quot;&gt;kg/㎠&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;12&quot; data-help=&quot;선택한 베어링의 설계 목표 반력입니다. 톤(tf)으로 입력합니다. M/E의 최소·최대 판정은 이 목표값과 별도로 적용합니다.&quot;&gt;&lt;label for=&quot;selected-bearing-reaction&quot;&gt;목표 반력 &lt;span class=&quot;bad&quot;&gt;필수&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;selected-bearing-reaction&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot; inputmode=&quot;decimal&quot; placeholder=&quot;0보다 큰 목표 톤수 입력&quot; required aria-required=&quot;true&quot; aria-describedby=&quot;validation-notice-message&quot;&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 톤힘&quot;&gt;톤(tf)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; id=&quot;bearing-percent-field&quot; data-order=&quot;13&quot; hidden data-help=&quot;선택한 베어링의 목표 반력 대비 허용오차입니다. 다른 베어링의 값에는 영향을 주지 않으며 위치를 다시 선택하면 설정값이 복원됩니다. 초기 5%는 화면 예시값이므로 실제 설계 기준에 맞게 설정하세요.&quot;&gt;&lt;label for=&quot;reaction-tolerance&quot;&gt;베어링별 허용오차&lt;/label&gt;&lt;div class=&quot;input-affix&quot;&gt;&lt;span class=&quot;unit-prefix&quot; aria-label=&quot;플러스 마이너스&quot;&gt;±&lt;/span&gt;&lt;select id=&quot;reaction-tolerance&quot;&gt;&lt;option value=&quot;5&quot; selected&gt;5&lt;/option&gt;&lt;option value=&quot;10&quot;&gt;10&lt;/option&gt;&lt;option value=&quot;15&quot;&gt;15&lt;/option&gt;&lt;option value=&quot;20&quot;&gt;20&lt;/option&gt;&lt;option value=&quot;25&quot;&gt;25&lt;/option&gt;&lt;option value=&quot;30&quot;&gt;30&lt;/option&gt;&lt;/select&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 퍼센트&quot;&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; id=&quot;bearing-criteria-field&quot; data-order=&quot;14&quot; hidden data-help=&quot;목표 대비 비율이 100% ± 허용오차 범위이면 OK이며 경계값도 포함합니다.&quot;&gt;&lt;label for=&quot;acceptance-criteria&quot;&gt;판정 기준&lt;/label&gt;&lt;select id=&quot;acceptance-criteria&quot; disabled&gt;&lt;option value=&quot;lte&quot; selected&gt;허용범위 이내 OK (경계 포함)&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; id=&quot;bearing-min-field&quot; data-order=&quot;13&quot; data-help=&quot;M/E 베어링의 허용 반력 최소값입니다. 최소값 이상, 최대값 이하가 허용범위이며 목표 반력 대비 %와 별도로 관리합니다.&quot;&gt;&lt;label for=&quot;bearing-reaction-min&quot;&gt;허용 반력 최소값&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;bearing-reaction-min&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;any&quot; inputmode=&quot;decimal&quot; placeholder=&quot;최소값 입력&quot; aria-describedby=&quot;validation-notice-message&quot;&gt;&lt;span class=&quot;unit-suffix&quot;&gt;톤(tf)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; id=&quot;bearing-max-field&quot; data-order=&quot;14&quot; data-help=&quot;M/E 베어링의 허용 반력 최대값입니다. 최소값보다 작게 입력할 수 없으며 베어링별로 각각 보관합니다.&quot;&gt;&lt;label for=&quot;bearing-reaction-max&quot;&gt;허용 반력 최대값&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;bearing-reaction-max&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;any&quot; inputmode=&quot;decimal&quot; placeholder=&quot;최대값 입력&quot; aria-describedby=&quot;validation-notice-message&quot;&gt;&lt;span class=&quot;unit-suffix&quot;&gt;톤(tf)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

              &lt;/div&gt;
            &lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;screen&quot; data-panel=&quot;measure&quot;&gt;
          &lt;div class=&quot;headline&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;measurement-bearing-title&quot;&gt;M/E(FWD) · Jack-up 측정·분석&lt;/h2&gt;&lt;p class=&quot;sub&quot; id=&quot;measurement-device-context&quot;&gt;측정 베어링을 선택하세요&lt;/p&gt;&lt;p class=&quot;sub&quot; id=&quot;measurement-phase-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;세션 RUN-02 · Lifting 기록 중 · 측정점 0개&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;action primary&quot; id=&quot;end-data-measurement&quot; type=&quot;button&quot; data-jw-tooltip=&quot;현재 베어링의 데이터 기록을 종료합니다. 수신 표시는 유지되며 유압장치는 제어하지 않습니다.&quot;&gt;데이터 측정 종료&lt;/button&gt;&lt;/div&gt;

                  &lt;path class=&quot;value-arc&quot; id=&quot;live-pressure-arc&quot; pathLength=&quot;100&quot; stroke-dasharray=&quot;48.6 100&quot; d=&quot;M35 120 A85 85 0 0 1 205 120&quot;/&gt;

                  &lt;text class=&quot;dial-value&quot; id=&quot;live-pressure-dial-value&quot; x=&quot;120&quot; y=&quot;103&quot; text-anchor=&quot;middle&quot;&gt;486.3&lt;/text&gt;

          &lt;div class=&quot;headline&quot;&gt;&lt;div&gt;&lt;h2&gt;그래프 분석 · 작업자 보정&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;압력-변위 원시 곡선을 확인하고 분석선 끝점을 손가락으로 움직여 기울기를 보정&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;action&quot; id=&quot;open-analysis-graph&quot; type=&quot;button&quot; data-jw-tooltip=&quot;압력-변위 분석 그래프를 태블릿 화면 전체로 확대&quot;&gt;그래프 전체 화면&lt;/button&gt;&lt;/div&gt;

          &lt;div class=&quot;grid two analysis-main-grid&quot;&gt;
