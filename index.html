:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {

  line-height: var(--line-height-small);
}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;

.btn-primary .text-muted {

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

}

  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  background: var(--secondary);
  cursor: inherit;
  font: inherit;

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  min-height: 72px;
  padding: 8px 10px;

.form-control:focus-visible {

.form-control:disabled,

.form-select:focus-visible {

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;style&gt;
    #jackup-wireframe {

              &lt;div class=&quot;field storage-field&quot; data-order=&quot;7&quot; data-help=&quot;태블릿 내부 저장공간에서 프로젝트 폴더를 직접 찾아 선택합니다. 선택한 위치에 원시값·최종값·리포트가 저장됩니다.&quot;&gt;&lt;label for=&quot;storage-location&quot;&gt;저장 위치&lt;/label&gt;&lt;div class=&quot;input-action&quot;&gt;&lt;input id=&quot;storage-location&quot; value=&quot;/storage/emulated/0/Jackup/H2678/Run02&quot; readonly aria-readonly=&quot;true&quot;&gt;&lt;button class=&quot;action&quot; id=&quot;browse-storage-folder&quot; type=&quot;button&quot; data-tooltip=&quot;태블릿 내부 저장공간의 폴더 목록을 열어 저장 위치 선택&quot;&gt;폴더 선택&lt;/button&gt;&lt;/div&gt;&lt;span class=&quot;field-note&quot;&gt;태블릿 내부 저장공간&lt;/span&gt;&lt;/div&gt;

                  &lt;button class=&quot;folder-choice&quot; type=&quot;button&quot; data-folder-path=&quot;/storage/emulated/0/Documents&quot; aria-pressed=&quot;false&quot;&gt;&lt;i data-lucide=&quot;folder&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Documents&lt;br&gt;&lt;span class=&quot;sub&quot;&gt;문서&lt;/span&gt;&lt;/button&gt;

                &lt;/div&gt;
                &lt;div class=&quot;folder-picker-actions&quot;&gt;&lt;button class=&quot;action&quot; id=&quot;cancel-folder-selection&quot; type=&quot;button&quot;&gt;취소&lt;/button&gt;&lt;button class=&quot;action primary&quot; id=&quot;confirm-folder-selection&quot; type=&quot;button&quot;&gt;이 폴더 사용&lt;/button&gt;&lt;/div&gt;

          &lt;/div&gt;
          &lt;div class=&quot;grid two&quot; style=&quot;margin-top:12px&quot;&gt;
            &lt;div class=&quot;panel&quot; data-help=&quot;잭 유효면적은 압력(bar)을 하중(kN)으로 환산하는 핵심 상수입니다. 허용오차는 목표 반력 대비 OK/NG 판정 범위입니다.&quot;&gt;
              &lt;h3&gt;유압 잭 / 판정 조건&lt;/h3&gt;
              &lt;div class=&quot;formgrid&quot; style=&quot;grid-template-columns:1fr 1fr&quot;&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;8&quot; data-help=&quot;현장에 설치한 유압 잭 모델을 선택합니다. 모델값은 유효면적 검증에 사용합니다.&quot;&gt;&lt;label&gt;잭 모델&lt;/label&gt;&lt;input value=&quot;HJ-100T&quot;&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;9&quot; data-help=&quot;교정성적서 또는 카탈로그의 잭 유효면적 숫자만 입력합니다. 단위 cm²는 고정값이며 압력을 하중으로 환산하는 핵심 상수입니다.&quot;&gt;&lt;label for=&quot;effective-area&quot;&gt;유효면적&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;effective-area&quot; type=&quot;number&quot; step=&quot;0.1&quot; value=&quot;126.7&quot;&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 제곱센티미터&quot;&gt;cm²&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;10&quot; data-help=&quot;압력계가 전송하는 표시 단위를 선택합니다. 기본값은 bar입니다.&quot;&gt;&lt;label&gt;압력 단위&lt;/label&gt;&lt;select&gt;&lt;option&gt;bar&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;11&quot; data-help=&quot;반력 산정 시 Lift-off를 평가할 기준 변위 숫자만 입력합니다. 단위 mm는 고정값입니다.&quot;&gt;&lt;label for=&quot;reference-displacement&quot;&gt;기준 변위&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;reference-displacement&quot; type=&quot;number&quot; step=&quot;0.01&quot; value=&quot;0.60&quot;&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 밀리미터&quot;&gt;mm&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;12&quot; data-help=&quot;목표 반력 대비 측정 반력의 허용오차를 목록에서 선택합니다. ± 기호와 % 단위는 고정값입니다.&quot;&gt;&lt;label for=&quot;reaction-tolerance&quot;&gt;허용오차&lt;/label&gt;&lt;div class=&quot;input-affix&quot;&gt;&lt;span class=&quot;unit-prefix&quot; aria-label=&quot;플러스 마이너스&quot;&gt;±&lt;/span&gt;&lt;select id=&quot;reaction-tolerance&quot;&gt;&lt;option value=&quot;1&quot;&gt;1&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;2&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;3&lt;/option&gt;&lt;option value=&quot;5&quot; selected&gt;5&lt;/option&gt;&lt;option value=&quot;10&quot;&gt;10&lt;/option&gt;&lt;/select&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 퍼센트&quot;&gt;%&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot; data-order=&quot;13&quot; data-help=&quot;측정 오차율과 허용오차를 어떤 조건으로 비교하여 OK로 판정할지 선택합니다. 허용오차 변경 시 비교값도 자동 갱신됩니다.&quot;&gt;&lt;label for=&quot;acceptance-criteria&quot;&gt;판정 기준&lt;/label&gt;&lt;select id=&quot;acceptance-criteria&quot;&gt;&lt;option value=&quot;gte&quot;&gt;|오차율| ≥ 5% · 같거나 클 경우 OK&lt;/option&gt;&lt;option value=&quot;lte&quot; selected&gt;|오차율| ≤ 5% · 같거나 작을 경우 OK&lt;/option&gt;&lt;option value=&quot;gt&quot;&gt;|오차율| &amp;gt; 5% · 클 경우 OK&lt;/option&gt;&lt;option value=&quot;lt&quot;&gt;|오차율| &amp;lt; 5% · 작을 경우 OK&lt;/option&gt;&lt;option value=&quot;eq&quot;&gt;|오차율| = 5% · 같을 경우 OK&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;panel&quot; data-help=&quot;축계 도형에서 베어링을 선택하고 선택된 위치의 목표 반력과 상태만 확인합니다. 명칭은 해당 베어링 도형을 더블클릭해 수정합니다.&quot;&gt;
              &lt;h3&gt;베어링 구성&lt;/h3&gt;
              &lt;div class=&quot;shaft-layout&quot; data-help=&quot;축계를 기관측에서 선미측 방향으로 단순화한 개략 배치입니다. 베어링을 선택한 뒤 앞·뒤 이동 버튼으로 표시 순서를 조정합니다. 실제 위치 확정은 승인 도면을 기준으로 합니다.&quot;&gt;
                &lt;div class=&quot;shaft-direction&quot;&gt;&lt;span&gt;기관측 · 엔진&lt;/span&gt;&lt;span&gt;선미측 · 프로펠러&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;shaft-track&quot; id=&quot;shaft-track&quot;&gt;&lt;span class=&quot;shaft-end&quot;&gt;ENGINE&lt;/span&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;ME Bearing No.6&lt;/button&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;ME Bearing No.5&lt;/button&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Intermediate No.1&lt;/button&gt;&lt;button class=&quot;bearing-node&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Stern Tube FWD&lt;/button&gt;&lt;span class=&quot;shaft-end&quot;&gt;PROP.&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;layout-controls bearing-toolbar&quot;&gt;&lt;div class=&quot;field bearing-count-field&quot; data-order=&quot;14&quot; data-help=&quot;이번 시험에서 순차 측정할 베어링의 전체 개수입니다. 엔진 템플릿 선택 시 자동 구성되며 필요하면 변경할 수 있습니다.&quot;&gt;&lt;label for=&quot;bearing-count&quot;&gt;베어링 수&lt;/label&gt;&lt;input id=&quot;bearing-count&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;4&quot;&gt;&lt;/div&gt;&lt;button class=&quot;action&quot; id=&quot;move-bearing-forward&quot; type=&quot;button&quot;&gt;← 기관측 이동&lt;/button&gt;&lt;button class=&quot;action&quot; id=&quot;move-bearing-aft&quot; type=&quot;button&quot;&gt;선미측 이동 →&lt;/button&gt;&lt;button class=&quot;action&quot; id=&quot;remove-bearing&quot; type=&quot;button&quot;&gt;삭제&lt;/button&gt;&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;selected-bearing-editor&quot; data-order=&quot;15&quot; data-help=&quot;선택된 베어링 한 개의 정보만 표시합니다. 목표 반력은 승인 설계·축계 정렬 자료에서 확인해 입력하며 상태는 대기 또는 측정으로 색상 표시됩니다.&quot;&gt;
                &lt;div class=&quot;selected-bearing-name&quot;&gt;&lt;span class=&quot;label&quot;&gt;선택 베어링&lt;/span&gt;&lt;strong id=&quot;selected-setup-bearing-name&quot;&gt;ME Bearing No.6&lt;/strong&gt;&lt;/div&gt;
                &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;selected-bearing-reaction&quot;&gt;목표 반력&lt;/label&gt;&lt;div class=&quot;input-unit&quot;&gt;&lt;input id=&quot;selected-bearing-reaction&quot; type=&quot;number&quot; placeholder=&quot;설계값 입력&quot;&gt;&lt;span class=&quot;unit-suffix&quot; aria-label=&quot;단위 킬로뉴턴&quot;&gt;kN&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
                &lt;div class=&quot;bearing-status-box&quot;&gt;&lt;span class=&quot;label&quot;&gt;상태&lt;/span&gt;&lt;div class=&quot;bearing-status-chip waiting&quot; id=&quot;selected-bearing-status&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;대기&lt;/div&gt;&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;screen&quot; data-panel=&quot;bearing-select&quot;&gt;
          &lt;div class=&quot;headline&quot;&gt;&lt;div&gt;&lt;h2&gt;측정 베어링 선택&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;시험 설정에서 구성한 위치 중 이번에 Jack-up 측정할 베어링 선택&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;action primary&quot; id=&quot;start-bearing-button&quot; type=&quot;button&quot; data-tooltip=&quot;선택한 베어링의 영점 상태를 확인하고 Jack-up 측정 화면으로 이동&quot;&gt;선택 위치 측정 시작&lt;/button&gt;&lt;/div&gt;
          &lt;div class=&quot;panel&quot; data-help=&quot;기관측에서 선미측 방향으로 배치된 베어링의 진행 상태를 확인합니다. 완료 위치도 재측정 회차로 다시 선택할 수 있습니다.&quot;&gt;
            &lt;div class=&quot;shaft-layout&quot;&gt;
              &lt;div class=&quot;shaft-direction&quot;&gt;&lt;span&gt;기관측 · 엔진&lt;/span&gt;&lt;span&gt;선미측 · 프로펠러&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;shaft-track&quot;&gt;&lt;span class=&quot;shaft-end&quot;&gt;ENGINE&lt;/span&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;ME Bearing No.6&quot; data-target=&quot;820 kN&quot; data-previous=&quot;815 kN · OK&quot; aria-pressed=&quot;false&quot;&gt;ME Bearing No.6&lt;br&gt;완료&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;ME Bearing No.5&quot; data-target=&quot;790 kN&quot; data-previous=&quot;802 kN · OK&quot; aria-pressed=&quot;false&quot;&gt;ME Bearing No.5&lt;br&gt;완료&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;Intermediate Bearing No.1&quot; data-target=&quot;760 kN&quot; data-previous=&quot;728 kN · NG&quot; aria-pressed=&quot;true&quot;&gt;Intermediate No.1&lt;br&gt;측정 대기&lt;/button&gt;&lt;button class=&quot;bearing-node bearing-choice&quot; type=&quot;button&quot; data-bearing-name=&quot;Stern Tube FWD&quot; data-target=&quot;720 kN&quot; data-previous=&quot;미측정&quot; aria-pressed=&quot;false&quot;&gt;Stern Tube FWD&lt;br&gt;대기&lt;/button&gt;&lt;span class=&quot;shaft-end&quot;&gt;PROP.&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;grid two&quot; style=&quot;margin-top:12px&quot;&gt;
            &lt;div class=&quot;panel&quot; data-help=&quot;선택 위치의 목표 반력, 허용오차와 이전 회차 결과를 측정 전에 확인합니다.&quot;&gt;&lt;h3&gt;선택 위치&lt;/h3&gt;&lt;div class=&quot;metric&quot; id=&quot;selected-measurement-bearing&quot;&gt;Intermediate Bearing No.1&lt;/div&gt;&lt;table&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;목표 반력&lt;/td&gt;&lt;td id=&quot;selected-bearing-target&quot;&gt;760 kN&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;허용오차&lt;/td&gt;&lt;td&gt;±5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;측정 회차&lt;/td&gt;&lt;td&gt;2차 · 조정 후&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;이전 결과&lt;/td&gt;&lt;td id=&quot;selected-bearing-previous&quot; class=&quot;bad&quot;&gt;728 kN · NG&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
            &lt;div class=&quot;panel&quot; data-help=&quot;Jack-up 측정 시작 전 두 센서의 연결과 영점 상태를 확인합니다. 유압장치는 앱에서 제어하지 않습니다.&quot;&gt;&lt;h3&gt;측정 전 확인&lt;/h3&gt;&lt;table&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;압력 모듈&lt;/td&gt;&lt;td class=&quot;good&quot;&gt;연결 · Zero OK&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;다이얼 게이지&lt;/td&gt;&lt;td class=&quot;good&quot;&gt;연결 · Zero OK&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;배터리&lt;/td&gt;&lt;td&gt;82% / 76%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;데이터 스트리밍&lt;/td&gt;&lt;td class=&quot;good&quot;&gt;1초 주기 정상&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;banner&quot;&gt;선택 위치와 실제 JIG·유압 잭 설치 위치가 일치하는지 작업자가 최종 확인합니다.&lt;/div&gt;&lt;/div&gt;

        &lt;section class=&quot;screen&quot; data-panel=&quot;measure&quot;&gt;
          &lt;div class=&quot;headline&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;measurement-bearing-title&quot;&gt;Intermediate Bearing No.1 · Jack-up 측정&lt;/h2&gt;&lt;p class=&quot;sub&quot;&gt;세션 RUN-02 · Lifting · Step 07&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;status good&quot;&gt;&lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;LIVE · 1초 주기&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;stepper&quot; data-help=&quot;현재 베어링 측정의 단계 진행도입니다. 완료 단계는 녹색, 현재 단계는 청색, 대기 단계는 회색으로 표시합니다.&quot; aria-label=&quot;측정 진행 상태&quot;&gt;&lt;span class=&quot;step done&quot;&gt;&lt;/span&gt;&lt;span class=&quot;step done&quot;&gt;&lt;/span&gt;&lt;span class=&quot;step current&quot;&gt;&lt;/span&gt;&lt;span class=&quot;step&quot;&gt;&lt;/span&gt;&lt;span class=&quot;step&quot;&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;grid two&quot;&gt;

                &lt;div class=&quot;panel&quot; data-help=&quot;선택된 대표 직선과 Lift-off 기준으로 산정한 해당 베어링의 최종 반력입니다. 목표 반력과 비교하여 판정합니다.&quot;&gt;&lt;span class=&quot;label&quot;&gt;최종 반력&lt;/span&gt;&lt;div class=&quot;metric&quot;&gt;754.2 kN&lt;/div&gt;&lt;p class=&quot;sub&quot;&gt;목표 760.0 kN&lt;/p&gt;&lt;/div&gt;

              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;panel&quot; data-help=&quot;원본 측정값은 바꾸지 않고 대표 직선 계산에 포함할 시작점과 종료점만 조정합니다. 조정 후 재분석을 누르면 대표 직선과 Lift-off를 다시 계산합니다.&quot; style=&quot;margin-top:12px&quot;&gt;

              &lt;/div&gt;

      const selectedDisplacementModule = root.querySelector(&#x27;#selected-displacement-module&#x27;);

      const deviceSetStatus = root.querySelector(&#x27;#device-set-status&#x27;);

      const setupDeviceSetId = root.querySelector(&#x27;#setup-device-set-id&#x27;);

      const folderPicker = root.querySelector(&#x27;#folder-picker&#x27;);

      const selectLoweringRange = root.querySelector(&#x27;#select-lowering-range&#x27;);
      const analysisRerun = root.querySelector(&#x27;#analysis-rerun&#x27;);
      const analysisRangeStatus = root.querySelector(&#x27;#analysis-range-status&#x27;);

      const analysisLoweringDisplacement = root.querySelector(&#x27;#analysis-lowering-displacement&#x27;);

      const correctionHistoryBody = root.querySelector(&#x27;#correction-history-body&#x27;);
      const openLiveGraph = root.querySelector(&#x27;#open-live-graph&#x27;);

      const graphFullscreen = root.querySelector(&#x27;#graph-fullscreen&#x27;);
      const graphFullscreenTitle = root.querySelector(&#x27;#graph-fullscreen-title&#x27;);
      const graphFullscreenBody = root.querySelector(&#x27;#graph-fullscreen-body&#x27;);
      const graphFullscreenLegend = root.querySelector(&#x27;#graph-fullscreen-legend&#x27;);
      const closeGraphFullscreen = root.querySelector(&#x27;#close-graph-fullscreen&#x27;);
      const guideTooltip = root.querySelector(&#x27;#guide-tooltip&#x27;);
      const remeasureDecision = root.querySelector(&#x27;#remeasure-decision&#x27;);
      const remeasureReasonField = root.querySelector(&#x27;#remeasure-reason-field&#x27;);
      const remeasureReason = root.querySelector(&#x27;#remeasure-reason&#x27;);
      const finalOpinion = root.querySelector(&#x27;#final-opinion&#x27;);
      const saveFinalResult = root.querySelector(&#x27;#save-final-result&#x27;);
      const resultSaveStatus = root.querySelector(&#x27;#result-save-status&#x27;);
      const finalResultHistory = root.querySelector(&#x27;#final-result-history&#x27;);
      const helpTargets = [...root.querySelectorAll(&#x27;[data-tooltip], [data-help]&#x27;)];
      const hideTooltip = () =&gt; guideTooltip.classList.remove(&#x27;visible&#x27;);
      const showTooltip = (target) =&gt; {
        if (target.hasAttribute(&#x27;data-help&#x27;) &amp;&amp; !root.classList.contains(&#x27;guide-on&#x27;)) return;
        const message = target.getAttribute(&#x27;data-tooltip&#x27;) || target.getAttribute(&#x27;data-help&#x27;);
        if (!message) return;
        guideTooltip.textContent = message;
        guideTooltip.classList.add(&#x27;visible&#x27;);
        const rootRect = root.getBoundingClientRect();
        const targetRect = target.getBoundingClientRect();
        const tipRect = guideTooltip.getBoundingClientRect();
        const margin = 12;
        let left = targetRect.left - rootRect.left + (targetRect.width - tipRect.width) / 2;
        left = Math.max(margin, Math.min(left, rootRect.width - tipRect.width - margin));
        let top = targetRect.bottom - rootRect.top + 9;
        if (top + tipRect.height &gt; rootRect.height - margin) top = targetRect.top - rootRect.top - tipRect.height - 9;
        guideTooltip.style.left = `${left}px`;
        guideTooltip.style.top = `${Math.max(margin, top)}px`;
      };
      helpTargets.forEach((target) =&gt; {
        target.addEventListener(&#x27;mouseenter&#x27;, () =&gt; showTooltip(target));
        target.addEventListener(&#x27;mouseleave&#x27;, hideTooltip);
        target.addEventListener(&#x27;focusin&#x27;, () =&gt; showTooltip(target));
        target.addEventListener(&#x27;focusout&#x27;, hideTooltip);
      });
      let fullscreenGraphState = null;
      const exitGraphFullscreen = () =&gt; {
        if (!fullscreenGraphState) return;
        const { plot, parent, nextSibling, trigger } = fullscreenGraphState;
        if (nextSibling &amp;&amp; nextSibling.parentNode === parent) parent.insertBefore(plot, nextSibling);
        else parent.appendChild(plot);
        graphFullscreen.classList.remove(&#x27;open&#x27;);
        graphFullscreenBody.replaceChildren();
        graphFullscreenLegend.replaceChildren();
        trigger.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        fullscreenGraphState = null;
        trigger.focus();
      };
      const showGraphFullscreen = (plot, title, trigger) =&gt; {
        if (fullscreenGraphState) exitGraphFullscreen();
        const parent = plot.parentNode;
        const nextSibling = plot.nextSibling;
        const plotContainer = parent.classList.contains(&#x27;plot-wrap&#x27;) ? parent : plot;
        const legend = plotContainer.nextElementSibling &amp;&amp; plotContainer.nextElementSibling.classList.contains(&#x27;legend&#x27;) ? plotContainer.nextElementSibling : null;
        fullscreenGraphState = { plot, parent, nextSibling, trigger };
        graphFullscreenTitle.textContent = title;
        graphFullscreenBody.appendChild(plot);
        graphFullscreenLegend.replaceChildren(...(legend ? [...legend.children].map((item) =&gt; item.cloneNode(true)) : []));
        graphFullscreen.classList.add(&#x27;open&#x27;);
        trigger.setAttribute(&#x27;aria-expanded&#x27;, &#x27;true&#x27;);
        closeGraphFullscreen.focus();
      };
      const preparePlotExpandButton = (plot, button, label) =&gt; {
        const wrapper = document.createElement(&#x27;div&#x27;);
        wrapper.className = &#x27;plot-wrap&#x27;;
        plot.parentNode.insertBefore(wrapper, plot);
        wrapper.appendChild(plot);
        wrapper.appendChild(button);
        button.className = &#x27;plot-expand&#x27;;
        button.setAttribute(&#x27;aria-label&#x27;, label);
        button.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        const icon = document.createElement(&#x27;i&#x27;);
        icon.setAttribute(&#x27;data-lucide&#x27;, &#x27;maximize-2&#x27;);
        icon.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        button.replaceChildren(icon);
      };
      preparePlotExpandButton(root.querySelector(&#x27;#live-trend-plot&#x27;), openLiveGraph, &#x27;실시간 추세 그래프 크게 보기&#x27;);
      preparePlotExpandButton(analysisPlot, openAnalysisGraph, &#x27;분석 그래프 크게 보기&#x27;);
      setTimeout(() =&gt; {
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 20, height: 20 } });
      }, 0);
      openLiveGraph.addEventListener(&#x27;click&#x27;, () =&gt; showGraphFullscreen(root.querySelector(&#x27;#live-trend-plot&#x27;), &#x27;실시간 하중-변위 추세&#x27;, openLiveGraph));
      openAnalysisGraph.addEventListener(&#x27;click&#x27;, () =&gt; showGraphFullscreen(analysisPlot, &#x27;Lifting · Lowering 분석 그래프&#x27;, openAnalysisGraph));
      closeGraphFullscreen.addEventListener(&#x27;click&#x27;, exitGraphFullscreen);
      root.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;Escape&#x27; &amp;&amp; fullscreenGraphState) exitGraphFullscreen();
      });
      buttons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (fullscreenGraphState) exitGraphFullscreen();
        buttons.forEach((item) =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === button)));
        panels.forEach((panel) =&gt; panel.classList.toggle(&#x27;active&#x27;, panel.dataset.panel === button.dataset.screen));
      }));
      reportTabs.forEach((tab) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; {
        reportTabs.forEach((item) =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === tab)));
        reportTabPanels.forEach((panel) =&gt; panel.classList.toggle(&#x27;active&#x27;, panel.dataset.reportPanel === tab.dataset.reportTab));
      }));
      historyLinks.forEach((link) =&gt; link.addEventListener(&#x27;click&#x27;, () =&gt; {
        const isCurrent = link.dataset.current === &#x27;true&#x27;;
        historyContext.classList.toggle(&#x27;readonly&#x27;, !isCurrent);
        historyContextLabel.textContent = isCurrent ? &#x27;현재 시험&#x27; : &#x27;과거 시험 · 읽기 전용&#x27;;
        historyContextDetail.textContent = `${link.dataset.testId} · 시험일 ${link.dataset.testDate} · 작업자 ${link.dataset.worker} · 세트 이름 ${link.dataset.setName} · ${link.dataset.setModules} · ${link.dataset.round} · ${link.dataset.status}`;
        dataPanel.querySelectorAll(&#x27;input, textarea&#x27;).forEach((control) =&gt; {
          control.disabled = !isCurrent;
        });
        dataEditActions.forEach((action) =&gt; {
          action.disabled = !isCurrent;

        root.querySelector(&#x27;[data-screen=&quot;data&quot;]&#x27;).click();
      }));
      const requestedPanel = window.location.hash.replace(&#x27;#&#x27;, &#x27;&#x27;);
      const requestedButton = buttons.find((button) =&gt; button.dataset.screen === requestedPanel);
      if (requestedButton) requestedButton.click();
      newTestButton.addEventListener(&#x27;click&#x27;, () =&gt; root.querySelector(&#x27;[data-screen=&quot;setup&quot;]&#x27;).click());

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    );

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      .then(({ x, y }) =&gt; {

      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);

  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }

    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
